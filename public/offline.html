<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FARID AI — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #0b0f14;
        color: #e6edf3;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #93a4b3;
        font-size: 14px;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #2ee6c5;
        color: #05221d;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="FARID AI logo" />
    <h1>You're offline</h1>
    <p>
      FARID AI needs an internet connection to answer. Your saved chats return once you reconnect.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
